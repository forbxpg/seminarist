[project]
name = "smr-core"
version = "0.1.0"
description = "Shared kernel for every domain: settings, database, audit log, file storage, clock."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0,<0.32.0",
    "dishka>=1.10.1,<2.0.0",
    "pillow>=13.0.0,<14",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "pypdfium2>=5.14.0,<6",
    "redis>=8.1.0,<9.0.0",
    "sqlalchemy[asyncio]>=2.1.1,<3.0.0",
]
# Internal to the workspace: PyPI refuses an upload with this classifier.
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "smr.core"
