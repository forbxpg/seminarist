[project]
name = "smr-roster"
version = "0.1.0"
description = "Groups, their rosters and the binding of Telegram accounts to roster rows."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["smr-core"]
# Internal to the workspace: PyPI refuses an upload with this classifier.
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "smr.roster"

[tool.uv.sources]
smr-core = { workspace = true }
