[project]
name = "smr-notifications"
version = "0.1.0"
description = "Notifications: a transactional outbox, preferences and the texts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["smr-core", "smr-roster"]
# Internal to the workspace: PyPI refuses an upload with this classifier.
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "smr.notifications"

[tool.uv.sources]
smr-core = { workspace = true }
smr-roster = { workspace = true }
