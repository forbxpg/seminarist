# Workspace root. It is not a package: members live in packages/ (domains and the
# shared kernel) and apps/ (the processes that run them). Install everything with
# `uv sync --all-packages`; plain `uv sync` installs the root only.
[project]
name = "seminarist"
version = "0.0.0"
description = "seminarist: uv workspace root for the domain packages and the apps."
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
pythonpath = [
    "packages/core/tests/support",
    "packages/roster/tests/support",
    "packages/gradebook/tests/support",
    "packages/sessions/tests/support",
    "packages/homework/tests/support",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
    "-m",
    "not integration",
]
markers = ["integration: needs Docker; starts PostgreSQL with testcontainers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_package = "smr"
include_external_packages = true

[dependency-groups]
dev = [
    "basedpyright>=1.40.1,<2.0.0",
    "import-linter>=2.15,<3.0.0",
    "pre-commit>=4.6.2,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "ruff>=0.16.10,<0.17.0",
    "testcontainers[postgres]>=4.15.0,<5.0.0",
]

[[tool.importlinter.contracts]]
name = "Packages know neither Telegram, nor the task queue, nor the apps"
type = "forbidden"
source_modules = [
    "smr.core",
    "smr.roster",
    "smr.gradebook",
    "smr.sessions",
    "smr.homework",
]
forbidden_modules = [
    "smr.migrator",
    "aiogram",
    "aiogram_dialog",
    "taskiq",
]

[[tool.importlinter.contracts]]
name = "The kernel knows no domain"
type = "forbidden"
source_modules = ["smr.core"]
forbidden_modules = ["smr.roster", "smr.gradebook", "smr.sessions", "smr.homework"]

[[tool.importlinter.contracts]]
name = "The roster depends on no feature"
type = "forbidden"
source_modules = ["smr.roster"]
forbidden_modules = ["smr.gradebook", "smr.sessions", "smr.homework"]

[[tool.importlinter.contracts]]
name = "The ledger knows nothing that writes to it"
type = "forbidden"
source_modules = ["smr.gradebook"]
forbidden_modules = ["smr.sessions", "smr.homework"]

[[tool.importlinter.contracts]]
name = "Features that write to the ledger stay independent"
type = "independence"
modules = ["smr.sessions", "smr.homework"]

[[tool.importlinter.contracts]]
name = "Domain rules know no storage"
type = "forbidden"
source_modules = [
    "smr.roster.domain",
    "smr.gradebook.domain",
    "smr.gradebook.scoring",
    "smr.sessions.domain",
    "smr.homework.domain",
]
forbidden_modules = ["sqlalchemy"]

