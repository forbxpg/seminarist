[project]
name = "smr-migrator"
version = "0.1.0"
description = "Migrator: applies every package's Alembic revisions, once, before the bot starts."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0,<2.0.0",
    "smr-core",
    "smr-gradebook",
    "smr-roster",
    "smr-sessions",
    "sqlalchemy[asyncio]>=2.1.1,<3.0.0",
]
# Internal to the workspace: PyPI refuses an upload with this classifier.
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
smr-migrator = "smr.migrator:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "smr.migrator"

[tool.uv.sources]
smr-core = { workspace = true }
smr-roster = { workspace = true }
smr-gradebook = { workspace = true }
smr-sessions = { workspace = true }
