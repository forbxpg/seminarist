# The whole bot: `docker compose up -d --build`. Settings come from .env.
# No port is published: PostgreSQL and Redis are reachable only inside this network.

x-app: &app
  build: .
  image: seminarist:local
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./data:/data
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrator:
    <<: *app
    restart: "no"
    command: ["smr-migrator", "upgrade"]

  # Exactly one bot: Telegram refuses two pollers on the same token.
  bot:
    <<: *app
    command: ["smr-bot"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["taskiq", "worker", "smr.worker.broker:broker"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Exactly one scheduler: two would queue every scheduled task twice.
  scheduler:
    <<: *app
    command: ["taskiq", "scheduler", "smr.worker.broker:scheduler"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
